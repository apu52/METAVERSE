<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Modal Popup</title>

    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <button class="btn" id="openBtn">Submit</button>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Modal -->
    <div class="pop-up" id="popup" role="dialog" aria-modal="true" aria-hidden="true">
        <img src="404-tick.png" alt="Success icon" />
        <h2 id="popup-title">Thank You</h2>
        <p id="popup-msg">Your details have been successfully submitted. Thanks!</p>
        <button class="ok-btn" id="closeBtn">OK</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
